{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="{% static 'vrproapp/login.css' %}">
</head>
<body>
  <div class="form-box tall">
    <div class="progressbar">
      <div class="progress-step active"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
      <div class="progress-step"></div>
    </div>

    <form id="signupForm" method="post" action="{% url 'signup' %}">
      {% csrf_token %}
      <!-- Step 1 -->
      <div class="form-step active">
        <h2 class="neon-title">Sign Up</h2>
        <input type="text" name="fullname" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <div class="btns"><button type="button" class="next-btn">Next</button></div>
      </div>

      <!-- Step 2 -->
      <div class="form-step">
        <h2 class="neon-title">Select Role</h2>
        <select id="role" name="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="patient">Patient</option>
          <option value="therapist">Therapist</option>
          <option value="researcher">Researcher</option>
        </select>
        <div class="btns"><button type="button" class="prev-btn">Back</button><button type="button" class="next-btn">Next</button></div>
      </div>

      <!-- Step 3 -->
      <div class="form-step" id="role-fields">
        <h2 class="neon-title">Additional Info</h2>
        <div class="role-section patient-fields hidden">
          <input type="number" name="age" placeholder="Age" min="10" max="120">
          <select name="gender">
            <option value="" disabled selected>Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
        <div class="role-section therapist-fields hidden">
          <input type="text" name="license" placeholder="License Number">
          <input type="number" name="experience" placeholder="Years of Experience" min="0">
          <input type="text" name="specialization" placeholder="Specialization">
        </div>
        <div class="role-section researcher-fields hidden">
          <input type="text" name="institution" placeholder="Institution / Organization">
          <input type="text" name="research_field" placeholder="Field of Research">
        </div>
        <div class="btns"><button type="button" class="prev-btn">Back</button><button type="button" class="next-btn">Next</button></div>
      </div>

      <!-- Step 4 -->
      <div class="form-step">
        <h2 class="neon-title">Finalize</h2>
        <label><input type="checkbox" name="agree" required> I agree to the Terms & Privacy Policy</label>
        <div class="btns"><button type="button" class="prev-btn">Back</button><button type="submit">Sign Up</button></div>
      </div>
    </form>

    {% for msg in messages %}
      <p style="color:green; text-align:center;">{{ msg }}</p>
    {% endfor %}
    <p class="switch-text">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>

  <!-- Keep your existing JS below (no change needed) -->
  <script>
  // your multi-step JS (keep the same code you had)
  const steps = document.querySelectorAll(".form-step");
  const nextBtns = document.querySelectorAll(".next-btn");
  const prevBtns = document.querySelectorAll(".prev-btn");
  const progressSteps = document.querySelectorAll(".progress-step");
  const roleSelect = document.getElementById("role");
  const patientFields = document.querySelector(".patient-fields");
  const therapistFields = document.querySelector(".therapist-fields");
  const researcherFields = document.querySelector(".researcher-fields");
  let currentStep = 0;
  function updateProgressBar(step) {
    progressSteps.forEach((ps, i) => { if (i <= step) ps.classList.add("active"); else ps.classList.remove("active"); });
  }
  nextBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      if (currentStep === 1) {
        patientFields.classList.add("hidden");
        therapistFields.classList.add("hidden");
        researcherFields.classList.add("hidden");
        if (roleSelect.value === "patient") patientFields.classList.remove("hidden");
        if (roleSelect.value === "therapist") therapistFields.classList.remove("hidden");
        if (roleSelect.value === "researcher") researcherFields.classList.remove("hidden");
      }
      if (currentStep < steps.length - 1) { steps[currentStep].classList.remove("active"); currentStep++; steps[currentStep].classList.add("active"); updateProgressBar(currentStep); }
    });
  });
  prevBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      if (currentStep > 0) { steps[currentStep].classList.remove("active"); currentStep--; steps[currentStep].classList.add("active"); updateProgressBar(currentStep); }
    });
  });
  </script>
</body>
</html>
