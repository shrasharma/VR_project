{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'vrproapp/login.css' %}">
</head>
<body>
  <div class="form-box">
    <h2 class="neon-title">Login</h2>

    {% if message %}<p style="color:red;text-align:center;">{{ message }}</p>{% endif %}
    {% for msg in messages %}<p style="color:green;text-align:center;">{{ msg }}</p>{% endfor %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p class="switch-text">Don’t have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
  </div>
</body>
</html>
